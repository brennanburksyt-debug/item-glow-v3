name: Build Mod Jar
on:
  push:
    branches: [ main ]
  workflow_dispatch: # allows manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
  matrix:
    java: [17, 21]
steps:
  - uses: actions/setup-java@v5
    with:
      distribution: 'temurin'
      java-version: ${{ matrix.java }}

      - name: Build mod jar
        run: ./gradlew jar
